<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammad Khalifah Erian · Frontend Developer</title>
    <meta
      name="description"

    <!-- pasang tema sebelum React jalan supaya tidak sempat tampil dengan warna yang salah.
         key harus sama dengan THEME_KEY di src/theme/theme.ts -->
    <script>
      try {
        if (localStorage.getItem("p5-theme") === "blue")
          document.documentElement.dataset.theme = "blue";
      } catch (e) {}
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Muhammad Khalifah Erian · Frontend Developer" />

      property="og:description"
      content="React · TypeScript · data-heavy dashboards, charts, and geospatial maps."
    />

    <script type="module" src="/src/main.tsx"></script>
  </body>
